<div class="wishlist-container">
  <h1 class="page-title">I Miei Preferiti</h1>
  <div class="divider"></div>

  <div *ngIf="preferiti.length === 0" class="empty-state">
    <svg class="empty-heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
    </svg>
    <p>La tua lista dei desideri è vuota.</p>
    <a routerLink="/prodotti" class="btn-continue">ESPLORA COLLEZIONE</a>
  </div>

  <div class="wishlist-grid" *ngIf="preferiti.length > 0">
    
    <div class="watch-card" *ngFor="let p of preferiti" [ngClass]="{'prodotto-finito': p.quantita <= 0}">
      
      <button class="remove-btn" (click)="rimuovi(p)" title="Rimuovi dai preferiti">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>

      <div class="clickable-area" [routerLink]="['/prodotto', p.id!]">
        
        <div class="immagine-box" style="position: relative; display: flex; justify-content: center; align-items: center; width: 100%;">
          <div class="badge-sconto" *ngIf="p.prezzoScontato && p.prezzoScontato > 0 && p.quantita > 0">SALE</div>
          
          <div class="badge-esaurito" *ngIf="p.quantita <= 0">ESAURITO</div>
          
          <img [src]="(p.immagini && p.immagini.length > 0 && p.immagini[0] !== '') ? p.immagini[0] : 'assets/no-foto.png'" alt="{{ p.modello || p.nome }}">
        </div>
        
        <div class="info-prodotto">
          <div class="marca">{{ p.marca }}</div>
          <div class="descrizione-lunga">{{ p.nome || p.modello }}</div>
          <div class="dettagli-extra" *ngIf="p.anno">Circa {{ p.anno }}</div>
          
          <div class="prezzo-container">
            <ng-container *ngIf="p.prezzoScontato && p.prezzoScontato > 0; else prezzoNormale">
              <span class="prezzo-barrato" style="text-decoration: line-through; color: #999; font-size: 14px; margin-right: 10px;">{{ p.prezzo | number:'1.0-0':'it-IT' }} €</span>
              <span class="prezzo-rosso" style="color: #d90000; font-weight: bold; font-size: 20px;">{{ p.prezzoScontato | number:'1.0-0':'it-IT' }} €</span>
            </ng-container>
            <ng-template #prezzoNormale>
              <span class="prezzo" style="font-weight: bold; font-size: 20px;">{{ p.prezzo | number:'1.0-0':'it-IT' }} €</span>
            </ng-template>
          </div>
        </div>
      </div>

      <button class="btn-black-full" [routerLink]="['/prodotto', p.id!]">
        VEDI DETTAGLI
      </button>

    </div>
  </div>
</div>
